version: '3.8'

services:
  # Aplicação NestJS
  antares-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antares-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mysql
    networks:
      - antares-network

  # MySQL (opcional - caso queira rodar o banco em container)
  mysql:
    image: mysql:8.0
    container_name: antares-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: antares
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backups:/backups
    networks:
      - antares-network
    command: --default-authentication-plugin=mysql_native_password

  # Nginx (opcional - reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: antares-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - antares-backend
    networks:
      - antares-network

volumes:
  mysql-data:

networks:
  antares-network:
    driver: bridge
